[project]
name = "ai-tracker-data"
version = "0.1.0"
description = "AI Incident Tracker — Pydantic data models and ETL pipeline for Supabase"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "supabase>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
